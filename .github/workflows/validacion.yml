name: Validacion del paquete

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: config/requirements.txt
      - name: Instalar dependencias Python
        run: python -m pip install -r config/requirements.txt
      - name: Probar paquete y reportes sin escanear
        run: python -B -m unittest discover -s tests -v
      - name: Comprobar ayuda
        run: python -B main.py --help
      - name: Comprobar version
        run: python -B main.py --version
      - name: Validar sintaxis del instalador Windows
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install/install.ps1'), [ref]$tokens, [ref]$parseErrors
          ) > $null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validar sintaxis del instalador Linux
        if: runner.os == 'Linux'
        run: bash -n install/install.sh
