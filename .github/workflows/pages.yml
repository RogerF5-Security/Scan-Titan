name: Publicar web de Scan Titan

# Manual mientras se habilita Pages para este repositorio privado.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validar paquete web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validar solo la web, sin ejecutar el escaner
        run: python3 -B -m unittest discover -s tests -p test_web_presentation.py -v
      - name: Validar JavaScript
        run: node --check docs/web/app.js
      - name: Configurar GitHub Pages existente
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Empaquetar exclusivamente la presentacion
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/web
  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar paquete validado
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
